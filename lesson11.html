<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>집 탐험가의 하루 · Lesson 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#193e38;--dark:#0f2622;--accent:#f2c14e;--soft:#f6f1e4;--ink:#1c2522;--ok:#2e7d4f;--bad:#c0392b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--soft);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:18px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:0}
h1,h2,h3{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;margin:0}
.hero{background:var(--main);color:#fff;padding:28px 20px 30px;text-align:center}
.brand{font-size:14px;font-weight:700;letter-spacing:1.5px;color:var(--accent)}
.hero h1{font-size:clamp(36px,7vw,58px);margin-top:8px;line-height:1.1}
.hero .sub{font-size:clamp(18px,3.4vw,24px);font-weight:700;margin:8px 0 0}
.wrap{max-width:900px;margin:0 auto;padding:22px 18px 40px}
.wrap>h2{font-size:28px;color:var(--main);margin:4px 0 16px}
.gates{display:flex;flex-direction:column;gap:16px}
.gate{display:flex;align-items:center;gap:18px;width:100%;text-align:left;background:#fff;border:3px solid var(--main);border-radius:22px;padding:18px 20px;min-height:110px}
.gate .ic{flex:0 0 auto;width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--gc)}
.gate .tx{flex:1;display:flex;flex-direction:column;gap:4px}
.gate .no{font-size:15px;font-weight:700;color:var(--gc)}
.gate .nm{font-family:'Jua';font-size:30px}
.gate .ac{font-size:16px;color:#4a5552;font-weight:700}
.gate .st{flex:0 0 auto;font-weight:900;font-size:17px;padding:10px 14px;border-radius:14px;background:var(--soft);color:var(--main);white-space:nowrap}
.gate .st.done{background:var(--ok);color:#fff}
.gate.locked{opacity:.92}
.ghost{display:block;margin:26px auto 0;background:transparent;color:#5b6663;font-size:15px;text-decoration:underline;padding:10px}
.big{display:block;width:100%;background:var(--accent);color:var(--dark);font-weight:900;font-size:22px;border-radius:18px;padding:18px;margin-top:20px}
.top{background:var(--main);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:16px;padding:10px 14px;border-radius:12px;min-height:44px}
.tt{flex:1;display:flex;flex-direction:column;gap:6px;min-width:220px}
.tt b{font-size:19px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps i{font-style:normal;font-size:14px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.14)}
.steps i.now{background:var(--accent);color:var(--dark)}
.steps i.ok{background:rgba(255,255,255,.38)}
.guide{font-size:20px;font-weight:900;color:var(--main);margin-bottom:10px}
.prog{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.prog span{width:26px;height:10px;border-radius:6px;background:#d9d2c2}
.prog span.on{background:var(--main)}
.card{background:#fff;border-radius:22px;padding:22px;border:2px solid #e2dacb}
.q{font-size:clamp(22px,4vw,28px);font-weight:900;line-height:1.4}
.q .en{font-family:'Noto Sans KR';}
.scene{font-size:clamp(40px,9vw,64px);letter-spacing:6px;text-align:center;background:var(--soft);border-radius:16px;padding:12px;margin-bottom:14px;line-height:1.2}
.scene small{display:block;font-size:18px;letter-spacing:0;font-weight:900;color:var(--main);margin-top:4px}
.ko{font-size:18px;color:#5b6663;font-weight:700;margin-top:6px}
.say{background:var(--soft);color:var(--main);border-radius:12px;font-size:16px;font-weight:900;padding:8px 12px;min-height:44px;margin-top:10px}
.opts{display:grid;gap:12px;margin-top:18px}
.opt{background:#fff;border:3px solid #cfc6b4;border-radius:16px;padding:16px;font-size:20px;font-weight:700;text-align:left;min-height:60px;color:var(--ink)}
.opt.right{border-color:var(--ok);background:#e3f4ea}
.opt.wrong{border-color:var(--bad);background:#fbe7e4;opacity:.7}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col{display:flex;flex-direction:column;gap:10px}
.m{background:#fff;border:3px solid #cfc6b4;border-radius:14px;padding:12px;font-size:19px;font-weight:700;min-height:58px;color:var(--ink)}
.m.sel{border-color:var(--main);background:var(--soft);box-shadow:0 0 0 3px var(--accent)}
.m.done{border-color:var(--ok);background:#e3f4ea;color:#1d5e38}
.m.shake,.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pic{font-size:64px;text-align:center}
.slots,.line{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:64px;padding:10px;border-radius:14px;background:var(--soft);margin:14px 0}
.slot{width:48px;height:56px;border-radius:10px;background:#fff;border:3px dashed #b9b09e;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.slot.f{border-style:solid;border-color:var(--main)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{background:var(--main);color:#fff;font-size:24px;font-weight:900;border-radius:12px;min-width:52px;min-height:56px;padding:8px 14px}
.tile.used{visibility:hidden}
.wtile{background:#fff;color:var(--ink);border:3px solid var(--main);font-size:21px;font-weight:700;border-radius:12px;min-height:52px;padding:8px 14px}
.line .wtile{background:var(--main);color:#fff}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{background:var(--main);color:#fff;font-weight:900;font-size:20px;border-radius:14px;padding:14px 22px;min-height:54px}
.btn.sub{background:#e8e1d2;color:var(--ink)}
.btn:disabled{opacity:.4}
.sent{font-size:clamp(21px,4vw,27px);font-weight:700;line-height:2}
.sent input{font:inherit;font-weight:900;color:var(--main);width:9em;max-width:60vw;border:0;border-bottom:4px solid var(--main);background:var(--soft);text-align:center;padding:2px 6px;border-radius:6px 6px 0 0}
textarea,.inp{width:100%;font:inherit;font-size:22px;border:3px solid #cfc6b4;border-radius:14px;padding:14px;background:#fff;color:var(--ink)}
textarea:focus,.inp:focus,.sent input:focus{outline:3px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.chips b{font-size:15px;color:#5b6663}
.chip{background:var(--soft);border:2px solid #d9d2c2;border-radius:20px;padding:4px 12px;font-size:17px;font-weight:700}
.fb{min-height:40px;margin-top:16px;font-size:21px;font-weight:900;text-align:center}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.hint{margin-top:10px;font-size:18px;font-weight:700;color:#8a5a00;background:#fff4d6;border-radius:12px;padding:10px 14px}
.checks{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:17px}
.checks li{color:#7a827f}.checks li.ok{color:var(--ok)}
.ex{background:var(--soft);border-radius:14px;padding:12px 16px;margin:10px 0 14px;font-size:18px;line-height:1.7}
.ex b{color:var(--main)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9}
.modal{background:#fff;border-radius:24px;padding:26px;width:100%;max-width:440px;text-align:center}
.modal h3{font-size:30px;color:var(--main)}
.modal p{font-weight:700;color:#4a5552}
.modal .inp{text-align:center;font-weight:900;letter-spacing:2px;margin-top:8px}
.clear{text-align:center;padding-top:30px}
.stamp{width:180px;height:180px;margin:0 auto;border-radius:50%;border:8px solid var(--gc,var(--main));display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);font-family:'Jua';font-size:30px;color:var(--gc,var(--main));background:#fff}
.stamp .e{font-size:60px}
.clear h2{font-size:38px;color:var(--main);margin-top:22px}
.clear p{font-size:20px;font-weight:700}
.done-text{white-space:pre-wrap;font-size:24px;line-height:1.7;font-weight:700;background:#fff;border:3px solid var(--main);border-radius:18px;padding:20px;margin-top:12px}
.cert{background:#fff;border:6px double var(--main);border-radius:20px;padding:30px 22px;text-align:center;margin-top:16px}
.cert h2{font-size:40px;color:var(--main)}
.cert .who{font-family:'Jua';font-size:44px;margin:16px 0 6px;color:var(--dark)}
.cert p{font-size:20px;font-weight:700;line-height:1.6}
.cert .seal{display:flex;justify-content:center;gap:12px;font-size:44px;margin-top:10px}
@media (max-width:560px){.cols{gap:8px}.m{font-size:16px;padding:10px 8px}.gate .ic{width:60px;height:60px;font-size:32px}.gate .nm{font-size:25px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const D = {"lesson": 11, "title": "집 탐험가의 하루", "sub": "What's in the Kitchen?", "certTitle": "집 탐험가 인증서", "theme": {"main": "#7a3e2b", "dark": "#4a2315", "accent": "#f2c14e", "soft": "#f8f0e6"}, "gates": [{"name": "단어 방", "icon": "🛏️", "color": "#2f7a55", "pw": "", "acts": [{"type": "match", "title": "뜻 매칭", "guide": "영어 낱말과 우리말 뜻을 짝지어요. (영어를 누르면 소리가 나요)", "rounds": [[["bedroom", "침실"], ["kitchen", "부엌"], ["bathroom", "욕실"], ["living room", "거실"], ["garden", "정원"], ["house", "집"]], [["window", "창문"], ["pot", "냄비"], ["toothbrush", "칫솔"], ["hairdryer", "헤어드라이어"], ["traditional", "전통의, 전통적인"]]]}, {"type": "spell", "title": "철자 조립", "guide": "글자를 눌러 낱말을 완성해요.", "items": [{"w": "kitchen", "ko": "부엌", "pic": "🍳"}, {"w": "window", "ko": "창문", "pic": "🪟"}, {"w": "garden", "ko": "정원", "pic": "🌷"}, {"w": "house", "ko": "집", "pic": "🏠"}, {"w": "bedroom", "ko": "침실", "pic": "🛏️"}, {"w": "toothbrush", "ko": "칫솔", "pic": "🪥"}]}, {"type": "blank", "title": "빈칸 타이핑", "guide": "빈칸에 알맞은 낱말을 직접 써요.", "items": [{"s": "There is a big bed in the ___.", "a": ["bedroom"], "ko": "침실에 큰 침대가 하나 있어."}, {"s": "There is a ___ in the kitchen.", "a": ["pot"], "ko": "부엌에 냄비가 하나 있어."}, {"s": "There is a ___ in the bathroom.", "a": ["hairdryer", "hair dryer"], "ko": "욕실에 헤어드라이어가 하나 있어."}, {"s": "What's that under the ___?", "a": ["window"], "ko": "창문 아래 저것은 무엇이니?"}, {"s": "It's a ___ Korean house.", "a": ["traditional"], "ko": "그것은 한국 전통 가옥이에요."}, {"s": "There are many flowers in the ___.", "a": ["garden"], "ko": "정원에 꽃이 많이 있어."}]}]}, {"name": "문장 거실", "icon": "🛋️", "color": "#3d5a9e", "pw": "", "acts": [{"type": "choose", "title": "문장 선택", "guide": "우리말 뜻에 맞는 영어 문장을 골라요.", "items": [{"q": "부엌에는 무엇이 있니?", "opts": ["What's in the kitchen?", "What's in the bedroom?", "Where is the kitchen?", "What's the kitchen?"]}, {"q": "침실에 큰 침대가 하나 있어.", "opts": ["There is a big bed in the bedroom.", "There are a big bed in the bedroom.", "There is a big bed in the kitchen.", "There is big bed the bedroom."]}, {"q": "욕실에 칫솔이 두 개 있어.", "opts": ["There are two toothbrushes in the bathroom.", "There is two toothbrushes in the bathroom.", "There are two toothbrush in the bathroom.", "There are two hairdryers in the bathroom."]}, {"q": "거실에 시계가 하나 있어.", "opts": ["There is a clock in the living room.", "There are a clock in the living room.", "There is a clock in the garden.", "There is clocks in the living room."]}, {"q": "내가 보이니?", "opts": ["Can you see me?", "Can I see you?", "Do you like me?", "Can you hear me?"]}]}, {"type": "order", "title": "어순 배열", "guide": "낱말을 순서대로 눌러 문장을 만들어요.", "items": [{"ko": "거실에는 무엇이 있니?", "tiles": ["What's", "in", "the", "living room?"]}, {"ko": "부엌에 냄비가 하나 있어.", "tiles": ["There", "is", "a", "pot", "in", "the", "kitchen."]}, {"ko": "침실에 책이 많이 있어.", "tiles": ["There", "are", "many", "books", "in", "the", "bedroom."]}, {"ko": "욕실에 헤어드라이어가 하나 있어.", "tiles": ["There", "is", "a", "hairdryer", "in", "the", "bathroom."]}, {"ko": "의자도 두 개 있어.", "tiles": ["There", "are", "two", "chairs,", "too."]}]}, {"type": "write", "title": "문장 쓰기", "guide": "우리말을 보고 영어 문장을 직접 써요.", "items": [{"ko": "부엌에는 무엇이 있니?", "a": ["What's in the kitchen?", "What is in the kitchen?"], "chips": ["What's", "in", "the", "kitchen"]}, {"ko": "정원에 나무가 하나 있어.", "a": ["There is a tree in the garden."], "chips": ["There is", "a", "tree", "in the garden"]}, {"ko": "침실에 그림이 많이 있어.", "a": ["There are many pictures in the bedroom.", "There are many paintings in the bedroom."], "chips": ["There are", "many", "pictures", "in the bedroom"]}, {"ko": "욕실에 헤어드라이어가 하나 있어.", "a": ["There is a hairdryer in the bathroom.", "There is a hair dryer in the bathroom."], "chips": ["There is", "a", "hairdryer", "in the bathroom"]}]}]}, {"name": "한옥 투어", "icon": "🏯", "color": "#b5651d", "pw": "", "acts": [{"type": "choose", "title": "방 안 살펴보기", "guide": "그림을 보고 질문에 알맞은 대답을 골라요.", "items": [{"scene": "🍲 🍲", "place": "kitchen", "q": "What's in the kitchen?", "say": "What's in the kitchen?", "opts": ["There are two pots.", "There is a pot.", "There are two beds.", "There is a toothbrush."]}, {"scene": "🛏️ 📚📚📚", "place": "bedroom", "q": "What's in the bedroom?", "say": "What's in the bedroom?", "opts": ["There is a bed. There are many books, too.", "There is a book. There are many beds, too.", "There are two pots.", "There is a hairdryer."]}, {"scene": "🌳 🌷🌷🌷", "place": "garden", "q": "What's in the garden?", "say": "What's in the garden?", "opts": ["There is a tree. There are many flowers, too.", "There are many trees. There is a flower, too.", "There is a window.", "There are two clocks."]}, {"scene": "💨 🪥🪥", "place": "bathroom", "q": "What's in the bathroom?", "say": "What's in the bathroom?", "opts": ["There is a hairdryer. There are two toothbrushes, too.", "There are two hairdryers.", "There is a toothbrush. There is a bed, too.", "There is a pot."]}]}, {"type": "choose", "title": "방 이름 맞히기", "guide": "설명을 듣고 읽은 뒤, 어느 곳인지 골라요.", "items": [{"q": "There are two big pots, gamasot.", "say": "There are two big pots, gamasot.", "ko": "여기는 어디일까요?", "opts": ["kitchen", "bedroom", "bathroom", "garden"]}, {"q": "There are traditional Korean shoes, gomusin. There are many flowers.", "say": "There are traditional Korean shoes, gomusin. There are many flowers.", "ko": "여기는 어디일까요?", "opts": ["garden", "kitchen", "bathroom", "living room"]}, {"q": "There is a hairdryer. There are two toothbrushes.", "say": "There is a hairdryer. There are two toothbrushes.", "ko": "여기는 어디일까요?", "opts": ["bathroom", "bedroom", "garden", "kitchen"]}, {"q": "There is a TV. There is a picture of my family.", "say": "There is a TV. There is a picture of my family.", "ko": "여기는 어디일까요?", "opts": ["living room", "bathroom", "garden", "kitchen"]}, {"q": "There is a big bed. There is a small table.", "say": "There is a big bed. There is a small table.", "ko": "여기는 어디일까요?", "opts": ["bedroom", "kitchen", "garden", "bathroom"]}]}, {"type": "free", "title": "우리 집 소개 쓰기", "guide": "우리 집(또는 내 방)을 영어로 소개해요.", "task": "우리 집이나 내 방을 소개하는 글을 3문장 이상 직접 써 보세요.", "example": ["예시) This is my bedroom.", "There is a big bed in my bedroom.", "There are many books, too."], "chips": ["This is my ~", "There is a ~", "There are ~", "too", "bedroom", "living room", "kitchen", "bathroom", "bed", "clock", "books", "pictures"], "minSent": 3, "checks": [{"label": "There is 사용하기", "re": "there is|there's"}, {"label": "There are 사용하기", "re": "there are"}]}]}]};
(function(){const r=document.documentElement.style;for(const k in D.theme)r.setProperty('--'+k,D.theme[k]);})();
const $app=document.getElementById('app');
const KEY='english-quest-lesson'+D.lesson;
let S={unlocked:[false,false,false],done:[false,false,false],name:''};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Array.isArray(v.done))S=Object.assign(S,v);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function norm(s){return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\bwhat's\b/g,'what is').replace(/\bthere's\b/g,'there is').replace(/\bthat's\b/g,'that is').replace(/\bit's\b/g,'it is').replace(/\bi'm\b/g,'i am').replace(/-/g,' ').replace(/[.!?,]/g,' ').replace(/\s+/g,' ').trim();}
const PRAISE=['정답이에요!','훌륭해요!','완벽해요!','최고예요!','잘했어요!'];
const praise=()=>PRAISE[Math.floor(Math.random()*PRAISE.length)];
let cur={g:0,a:0};

function home(){
  try{speechSynthesis.cancel();}catch(e){}
  const all=S.done.every(Boolean);
  $app.innerHTML=`<header class="hero"><div class="brand">ENGLISH QUEST 영어 탐험대 · GRADE 5 · LESSON ${D.lesson}</div><h1>${esc(D.title)}</h1><p class="sub">${esc(D.sub)}</p></header>
  <main class="wrap"><h2>세 관문을 차례로 통과하세요</h2><div class="gates">${D.gates.map((g,i)=>{
    const open=S.unlocked[i]||(!g.pw&&(i===0||S.done[i-1]));const st=S.done[i]?'<span class="st done">완료 ✓</span>':open?'<span class="st">입장하기 ›</span>':`<span class="st">🔒 ${g.pw?'암호':'잠김'}</span>`;
    return `<button class="gate ${open?'':'locked'}" style="--gc:${g.color}" onclick="openGate(${i})"><span class="ic">${g.icon}</span><span class="tx"><span class="no">관문 ${i+1}</span><span class="nm">${esc(g.name)}</span><span class="ac">${g.acts.map(a=>esc(a.title)).join(' → ')}</span></span>${st}</button>`;}).join('')}</div>
  ${all?`<button class="big" onclick="cert()">🏆 ${esc(D.certTitle)} 받기</button>`:''}
  <button class="ghost" onclick="askReset()">처음부터 다시 하기</button></main>`;
  window.scrollTo(0,0);
}
function modal(html){const m=document.createElement('div');m.className='mask';m.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(m);return m;}
function askReset(){const m=modal(`<h3>처음부터 다시?</h3><p>통과한 관문 기록이 모두 지워져요.</p><div class="row" style="justify-content:center"><button class="btn sub" id="no">아니요</button><button class="btn" id="yes">다시 하기</button></div>`);
  m.querySelector('#no').onclick=()=>m.remove();m.querySelector('#yes').onclick=()=>{S={unlocked:[false,false,false],done:[false,false,false],name:''};save();m.remove();home();};}
function openGate(i){
  const g=D.gates[i];
  if(S.unlocked[i]){startGate(i);return;}
  if(!g.pw){if(i>0&&!S.done[i-1]){const m=modal(`<div style="font-size:52px">🔒</div><h3>아직 잠겨 있어요</h3><p>관문 ${i} ${esc(D.gates[i-1].name)}을(를) 먼저 통과하면 열려요!</p><div class="row" style="justify-content:center"><button class="btn" id="cl">확인</button></div>`);m.querySelector('#cl').onclick=()=>m.remove();return;}startGate(i);return;}
  const m=modal(`<div style="font-size:52px">${g.icon}</div><h3>관문 ${i+1} · ${esc(g.name)}</h3><p>관문 입구예요. 암호를 입력하세요!</p><input class="inp" id="pw" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="암호 입력"><div class="fb" id="pwfb"></div><div class="row" style="justify-content:center"><button class="btn sub" id="cl">닫기</button><button class="btn" id="go">열기</button></div>`);
  const inp=m.querySelector('#pw'),fb=m.querySelector('#pwfb');
  const go=()=>{if(inp.value.trim().toLowerCase().replace(/\s/g,'')===g.pw){S.unlocked[i]=true;save();m.remove();startGate(i);}else{fb.className='fb no';fb.textContent='암호가 맞지 않아요. 다시 확인해 보세요.';inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');}};
  m.querySelector('#go').onclick=go;m.querySelector('#cl').onclick=()=>m.remove();inp.onkeydown=e=>{if(e.key==='Enter')go();};setTimeout(()=>inp.focus(),50);
}
function startGate(i){cur={g:i,a:0};runAct();}
function shell(){
  const g=D.gates[cur.g],act=g.acts[cur.a];
  $app.innerHTML=`<div class="top"><button class="back" onclick="home()">← 지도</button><div class="tt"><b>${g.icon} 관문 ${cur.g+1} · ${esc(g.name)}</b><span class="steps">${g.acts.map((x,k)=>`<i class="${k<cur.a?'ok':k===cur.a?'now':''}">${k+1}. ${esc(x.title)}</i>`).join('')}</span></div></div>
  <main class="wrap"><div class="guide">${esc(act.guide)}</div><div class="prog" id="prog"></div><div id="stage"></div><div id="fb" class="fb"></div></main>`;
  window.scrollTo(0,0);
}
function prog(i,n){document.getElementById('prog').innerHTML=Array.from({length:n},(_,k)=>`<span class="${k<i?'on':''}"></span>`).join('');}
function fb(ok,msg){const f=document.getElementById('fb');if(!f)return;f.className='fb '+(ok?'ok':'no');f.textContent=msg;}
function stage(){return document.getElementById('stage');}
function runAct(){shell();const act=D.gates[cur.g].acts[cur.a];({match:runMatch,spell:runSpell,blank:runBlank,choose:runChoose,order:runOrder,write:runWrite,free:runFree})[act.type](act);}
function nextAct(){
  if(cur.a<D.gates[cur.g].acts.length-1){cur.a++;runAct();}
  else{S.done[cur.g]=true;save();gateClear();}
}
function gateClear(){
  const g=D.gates[cur.g],all=S.done.every(Boolean);
  $app.innerHTML=`<main class="wrap clear" style="--gc:${g.color}"><div class="stamp"><span class="e">${g.icon}</span>CLEAR</div><h2>관문 ${cur.g+1} ${esc(g.name)} 통과!</h2>
  <p>${all?'세 관문을 모두 통과했어요! 인증서를 받으세요.':(D.gates[cur.g+1]&&D.gates[cur.g+1].pw?'다음 관문 입구에서 암호를 입력하세요.':'지도로 돌아가 다음 관문으로 출발하세요!')}</p>
  ${all?`<button class="big" onclick="cert()">🏆 ${esc(D.certTitle)} 받기</button>`:''}<button class="big" style="background:var(--main);color:#fff" onclick="home()">지도로 돌아가기</button></main>`;
  window.scrollTo(0,0);
}
function cert(){
  const draw=()=>{const n=S.name?esc(S.name):'○○○';
    $app.innerHTML=`<main class="wrap"><div class="row" style="margin-top:0"><input class="inp" id="nm" placeholder="이름을 입력하세요" value="${S.name?esc(S.name):''}" style="flex:1"><button class="btn" id="ok">확인</button></div>
    <div class="cert"><div class="brand" style="color:var(--main)">ENGLISH QUEST · LESSON ${D.lesson}</div><h2>${esc(D.certTitle)}</h2><div class="who">${n}</div>
    <p>위 탐험대원은 <b>${esc(D.sub)}</b> 단원의<br>세 관문을 모두 통과했으므로 이 인증서를 드립니다.</p><div class="seal">${D.gates.map(g=>g.icon).join('')}</div></div>
    <button class="big" style="background:var(--main);color:#fff" onclick="home()">지도로 돌아가기</button></main>`;
    const inp=document.getElementById('nm');const set=()=>{S.name=inp.value.trim().slice(0,12);save();draw();};document.getElementById('ok').onclick=set;inp.onkeydown=e=>{if(e.key==='Enter')set();};};
  draw();window.scrollTo(0,0);
}

/* ---- 뜻 매칭 ---- */
function runMatch(act){
  let r=0;
  const round=()=>{
    prog(r,act.rounds.length);fb(true,'');
    const pairs=act.rounds[r];const left=shuffle(pairs.map((p,i)=>({t:p[0],i})));const right=shuffle(pairs.map((p,i)=>({t:p[1],i})));
    stage().innerHTML=`<div class="cols"><div class="col">${left.map(x=>`<button class="m" data-s="L" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div><div class="col">${right.map(x=>`<button class="m" data-s="R" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div></div>`;
    let sel=null,left_n=pairs.length;
    stage().querySelectorAll('.m').forEach(b=>b.onclick=()=>{
      if(b.classList.contains('done'))return;
      if(b.dataset.s==='L'){speak(pairs[b.dataset.i][0]);}
      if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');return;}
      if(sel.dataset.i===b.dataset.i){[sel,b].forEach(x=>{x.classList.remove('sel');x.classList.add('done');});sel=null;left_n--;fb(true,praise());
        if(left_n===0){setTimeout(()=>{r++;if(r<act.rounds.length)round();else nextAct();},700);}}
      else{const a=sel;a.classList.remove('sel');sel=null;[a,b].forEach(x=>{x.classList.remove('shake');void x.offsetWidth;x.classList.add('shake');});fb(false,'짝이 아니에요. 다시 골라 보세요.');}
    });
  };round();
}
/* ---- 철자 조립 ---- */
function runSpell(act){
  let k=0;
  const item=()=>{
    prog(k,act.items.length);fb(true,'');
    const it=act.items[k],w=it.w;let letters;let n=0;do{letters=shuffle(w.split(''));n++;}while(letters.join('')===w&&n<20);
    let slots=Array(w.length).fill(null),miss=0;
    const draw=()=>{
      stage().innerHTML=`<div class="card"><div class="pic">${it.pic}</div><div class="q" style="text-align:center">${esc(it.ko)}</div><div style="text-align:center"><button class="say" id="say">🔊 듣기</button></div>
      <div class="slots">${slots.map((s,i)=>`<button class="slot ${s!==null?'f':''}" data-i="${i}">${s!==null?esc(letters[s]):''}</button>`).join('')}</div>
      <div class="tiles">${letters.map((l,i)=>`<button class="tile ${slots.includes(i)?'used':''}" data-i="${i}">${esc(l)}</button>`).join('')}</div>
      ${miss>=2?`<div class="hint">힌트: <b>${esc(w)}</b></div>`:''}</div>`;
      document.getElementById('say').onclick=()=>speak(w);
      stage().querySelectorAll('.tile').forEach(t=>t.onclick=()=>{const p=slots.indexOf(null);if(p<0)return;slots[p]=+t.dataset.i;check();});
      stage().querySelectorAll('.slot').forEach(s=>s.onclick=()=>{slots[+s.dataset.i]=null;draw();});
    };
    const check=()=>{draw();if(slots.includes(null))return;const got=slots.map(i=>letters[i]).join('');
      if(got===w){fb(true,praise()+' '+w);speak(w);setTimeout(()=>{k++;if(k<act.items.length)item();else nextAct();},1000);}
      else{miss++;fb(false,'철자가 달라요. 다시 조립해 보세요.');const sl=stage().querySelector('.slots');sl.classList.add('shake');setTimeout(()=>{slots=Array(w.length).fill(null);draw();},650);}};
    draw();
  };item();
}
/* ---- 빈칸 타이핑 ---- */
function runBlank(act){
  let k=0;
  const item=()=>{
    prog(k,act.items.length);fb(true,'');let miss=0;const it=act.items[k];const parts=it.s.split('___');
    stage().innerHTML=`<div class="card"><div class="sent">${esc(parts[0])}<input id="bi" autocomplete="off" autocapitalize="off" spellcheck="false">${esc(parts[1]||'')}</div><div class="ko">${esc(it.ko)}</div><div id="hint"></div>
    <div class="row"><button class="btn" id="ck">확인</button><button class="say" id="say" style="margin-top:0">🔊 듣기</button></div></div>`;
    const inp=document.getElementById('bi');setTimeout(()=>inp.focus(),50);
    document.getElementById('say').onclick=()=>speak(it.s.replace('___',it.a[0]));
    const ck=()=>{if(!inp.value.trim())return;if(it.a.map(norm).includes(norm(inp.value))){inp.disabled=true;fb(true,praise());speak(it.s.replace('___',it.a[0]));setTimeout(()=>{k++;if(k<act.items.length)item();else nextAct();},1100);}
      else{miss++;fb(false,'다시 써 볼까요?');inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');if(miss>=2)document.getElementById('hint').innerHTML=`<div class="hint">힌트: <b>${esc(it.a[0])}</b></div>`;}};
    document.getElementById('ck').onclick=ck;inp.onkeydown=e=>{if(e.key==='Enter')ck();};
  };item();
}
/* ---- 고르기 ---- */
function runChoose(act){
  let k=0;
  const item=()=>{
    prog(k,act.items.length);fb(true,'');const it=act.items[k];const ans=it.opts[0];
    stage().innerHTML=`<div class="card">${it.scene?`<div class="scene">${it.scene}${it.place?`<small>${esc(it.place)}</small>`:''}</div>`:''}<div class="q">${esc(it.q)}</div>${it.ko?`<div class="ko">${esc(it.ko)}</div>`:''}${it.say?`<button class="say" id="say">🔊 듣기</button>`:''}
    <div class="opts">${shuffle(it.opts).map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`;
    if(it.say){document.getElementById('say').onclick=()=>speak(it.say);}
    stage().querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.disabled)return;
      if(b.dataset.o===ans){b.classList.add('right');stage().querySelectorAll('.opt').forEach(x=>x.disabled=true);fb(true,praise());if(/[a-z]/i.test(ans))speak(ans);setTimeout(()=>{k++;if(k<act.items.length)item();else nextAct();},1200);}
      else{b.classList.add('wrong');b.disabled=true;fb(false,'다시 골라 보세요.');}});
  };item();
}
/* ---- 어순 배열 ---- */
function runOrder(act){
  let k=0;
  const item=()=>{
    prog(k,act.items.length);fb(true,'');const it=act.items[k];const target=it.tiles.join(' ');
    let pool;let n=0;do{pool=shuffle(it.tiles.map((t,i)=>({t,i})));n++;}while(pool.map(p=>p.t).join(' ')===target&&n<20);
    let line=[],miss=0;
    const draw=()=>{
      stage().innerHTML=`<div class="card"><div class="q">${esc(it.ko)}</div><div class="line">${line.map((p,j)=>`<button class="wtile" data-j="${j}">${esc(p.t)}</button>`).join('')||'<span style="color:#9a9384;font-weight:700;align-self:center">낱말을 순서대로 눌러요</span>'}</div>
      <div class="tiles">${pool.map((p,j)=>`<button class="wtile ${line.includes(p)?'used':''}" style="${line.includes(p)?'visibility:hidden':''}" data-p="${j}">${esc(p.t)}</button>`).join('')}</div>
      ${miss>=2?`<div class="hint">힌트: <b>${esc(target)}</b></div>`:''}
      <div class="row"><button class="btn" id="ck" ${line.length<pool.length?'disabled':''}>확인</button><button class="btn sub" id="rs">다시 놓기</button></div></div>`;
      stage().querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=pool[+b.dataset.p];if(!line.includes(p)){line.push(p);draw();}});
      stage().querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{line.splice(+b.dataset.j,1);draw();});
      document.getElementById('rs').onclick=()=>{line=[];draw();};
      document.getElementById('ck').onclick=()=>{const got=line.map(p=>p.t).join(' ');
        if(got===target){fb(true,praise());speak(target);stage().querySelectorAll('button').forEach(x=>x.disabled=true);setTimeout(()=>{k++;if(k<act.items.length)item();else nextAct();},1300);}
        else{miss++;fb(false,'순서가 달라요. 다시 놓아 보세요.');const l=stage().querySelector('.line');l.classList.remove('shake');void l.offsetWidth;l.classList.add('shake');if(miss>=2)draw();}};
    };draw();
  };item();
}
/* ---- 문장 쓰기 ---- */
function runWrite(act){
  let k=0;
  const item=()=>{
    prog(k,act.items.length);fb(true,'');let miss=0;const it=act.items[k];
    stage().innerHTML=`<div class="card"><div class="q">${esc(it.ko)}</div><div class="chips"><b>참고 단어</b>${it.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>
    <input class="inp" id="wi" style="margin-top:14px" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="영어 문장을 직접 써 보세요"><div id="hint"></div><div class="row"><button class="btn" id="ck">확인</button></div></div>`;
    const inp=document.getElementById('wi');setTimeout(()=>inp.focus(),50);
    const ck=()=>{if(!inp.value.trim())return;if(it.a.map(norm).includes(norm(inp.value))){inp.disabled=true;fb(true,praise());speak(it.a[0]);setTimeout(()=>{k++;if(k<act.items.length)item();else nextAct();},1300);}
      else{miss++;fb(false,'조금 달라요. 낱말과 순서를 살펴보세요.');inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');if(miss>=2)document.getElementById('hint').innerHTML=`<div class="hint">예시 정답: <b>${esc(it.a[0])}</b></div>`;}};
    document.getElementById('ck').onclick=ck;inp.onkeydown=e=>{if(e.key==='Enter')ck();};
  };item();
}
/* ---- 자유 쓰기 ---- */
function runFree(act){
  prog(0,1);
  stage().innerHTML=`<div class="card"><div class="q">${esc(act.task)}</div><div class="ex">${act.example.map(l=>esc(l)).join('<br>')}</div>
  <div class="chips" style="margin:-4px 0 12px"><b>참고 단어</b>${act.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>
  <textarea id="ft" rows="6" spellcheck="false" placeholder="여기에 직접 써 보세요"></textarea><ul class="checks" id="cl"></ul><div class="row"><button class="btn" id="fin" disabled>완성!</button></div></div>`;
  const ta=document.getElementById('ft');let cnt=0;
  const sentences=t=>t.split(/[.!?]+/).map(s=>s.trim()).filter(s=>s.split(/\s+/).length>=2);
  const upd=()=>{const t=ta.value,low=t.toLowerCase().replace(/[’‘]/g,"'");const n=sentences(t).length;
    const res=[{l:`${act.minSent}문장 이상 쓰기 (지금 ${n}문장)`,ok:n>=act.minSent}].concat(act.checks.map(c=>({l:c.label,ok:new RegExp(c.re,'i').test(low)})));
    document.getElementById('cl').innerHTML=res.map(r=>`<li class="${r.ok?'ok':''}">${r.ok?'✅':'⬜'} ${esc(r.l)}</li>`).join('');
    document.getElementById('fin').disabled=!res.every(r=>r.ok);};
  ta.oninput=upd;upd();
  document.getElementById('fin').onclick=()=>{prog(1,1);
    stage().innerHTML=`<div class="card"><div class="q">🎉 멋진 글이 완성됐어요!</div><div class="ko">선생님께 보여 주세요.</div><div class="done-text">${esc(ta.value.trim())}</div>
    <div class="row"><button class="btn sub" id="ed">고치기</button><button class="btn" id="nx">관문 통과하기</button></div></div>`;fb(true,'');
    const saved=ta.value;document.getElementById('ed').onclick=()=>{runFree(act);document.getElementById('ft').value=saved;document.getElementById('ft').dispatchEvent(new Event('input'));};
    document.getElementById('nx').onclick=nextAct;};
}
home();
</script>
